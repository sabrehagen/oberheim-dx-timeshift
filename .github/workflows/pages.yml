# Builds the interactive 3D walkthrough (webapp/) and publishes it to GitHub Pages.
# The site is served at https://<owner>.github.io/oberheim-dx-timeshift/
#
# One-time setup in the GitHub repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # pnpm version comes from the "packageManager" field
          package_json_file: webapp/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy the KiCad 3D model and anchors into the app (if the hardware exports exist)
        run: pnpm run sync-model

      - name: Build
        run: pnpm run build
        env:
          VITE_BASE: /oberheim-dx-timeshift/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
